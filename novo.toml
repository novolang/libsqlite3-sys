[package]
name        = "libsqlite3-sys"
version     = "0.1.1"
description = "Bindings over libsqlite3, the SQLite database engine: the connection, the prepared statement, the parameter bindings, the result columns, the error reporting and the library version, one declaration per C entry point."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used
# the package yet, and the tests exercise the entry points rather than
# a consumer's use of them.
stability   = "experimental"

# `sys`: the layer for a package that binds one C library and decides
# nothing of its own.  Every `pub fn` below is an `@ffi` declaration of
# a function in libsqlite3.
layer       = "sys"

category    = "bindings"

# The one C library.  `libsqlite3.so` is what the loader resolves these
# symbols against.  Installing this package does not install it.
wraps       = "libsqlite3"

tags        = ["ffi", "sqlite", "sqlite3", "database", "sql", "bindings"]
repository  = "https://github.com/novolang/libsqlite3-sys"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

[docs.pages]
"README.md" = "The C entry points of libsqlite3, one novo-lang declaration each"

[dependencies]
# None.  A binding over one C library depends on no novo-lang package.

# The link flag for the `library = "sqlite3"` name every declaration in
# `src/` carries.  `libsqlite3-dev` installs
# `/usr/lib/<arch>/pkgconfig/sqlite3.pc`, so pkg-config answers
# `-lsqlite3` on Debian and Ubuntu.  Without the block the default is
# `-lsqlite3`, which is the same flag on a system that put the library
# somewhere the linker already looks.
[ffi.sqlite3]
pkg_config = "sqlite3"
